name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A burst of merges deploys once: each newer push cancels the run still
# waiting in the debounce gate below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No-op gate held by the main-debounce environment's 10-minute wait timer
  # (no runner minutes while waiting). A manual dispatch skips it.
  debounce:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: main-debounce
    permissions: {}
    steps:
      - run: echo ok

  deploy:
    needs: debounce
    if: always() && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Migrations are forward-only and idempotent; wrangler tracks which have
      # been applied, so a redeploy with no new migration is a no-op.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply chainoftrust --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Required when the API token can see more than one account.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
